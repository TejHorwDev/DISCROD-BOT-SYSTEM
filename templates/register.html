<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register &bull; INDRA BOT SYSTEM</title>
  <meta name="description" content="One-Time License Key Registration for INDRA BOT SYSTEM">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%235865F2'/%3E%3Cpath d='M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.83z' transform='translate(1.2 1.2) scale(0.9)' fill='%23fff'/%3E%3Ccircle cx='7' cy='7' r='1.5' fill='%235865F2' transform='translate(1.2 1.2) scale(0.9)'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <style>
    :root {
      --bg-oled: #08090b;
      --card-bg: rgba(16, 18, 24, 0.92);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-focus: #5865F2;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent-glow: rgba(88, 101, 242, 0.28);
    }
    body {
      margin: 0;
      padding: 20px 0;
      min-height: 100vh;
      background-color: var(--bg-oled);
      background-image: 
        radial-gradient(circle at 50% 12%, rgba(88, 101, 242, 0.14) 0%, transparent 60%),
        radial-gradient(circle at 85% 85%, rgba(67, 181, 129, 0.07) 0%, transparent 50%),
        radial-gradient(circle at 15% 85%, rgba(240, 71, 71, 0.06) 0%, transparent 50%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text-main);
      box-sizing: border-box;
    }
    .register-container {
      width: 100%;
      max-width: 460px;
      padding: 20px;
      box-sizing: border-box;
      position: relative;
      z-index: 10;
    }
    .register-card {
      background: var(--card-bg);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid var(--border-subtle);
      border-radius: 22px;
      padding: 34px 30px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7), 0 0 45px rgba(88, 101, 242, 0.09);
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }
    .register-card:hover {
      border-color: rgba(88, 101, 242, 0.35);
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.8), 0 0 55px rgba(88, 101, 242, 0.16);
    }
    .brand-wrap {
      text-align: center;
      margin-bottom: 24px;
    }
    .brand-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, rgba(88, 101, 242, 0.25), rgba(88, 101, 242, 0.06));
      border: 1px solid rgba(88, 101, 242, 0.45);
      border-radius: 16px;
      margin-bottom: 14px;
      box-shadow: 0 8px 24px var(--accent-glow);
    }
    .title {
      margin: 0 0 6px 0;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #fff;
    }
    .subtitle {
      margin: 0;
      font-size: 13.5px;
      color: var(--text-muted);
      line-height: 1.4;
    }
    .form-col {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-group label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #cbd5e1;
    }
    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-icon {
      position: absolute;
      left: 14px;
      width: 17px;
      height: 17px;
      color: #64748b;
      pointer-events: none;
    }
    .form-input {
      width: 100%;
      padding: 11px 14px 11px 40px;
      background: #0f1117;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      color: #fff;
      font-size: 14px;
      outline: none;
      box-sizing: border-box;
      transition: all 0.2s ease;
    }
    .form-input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(88, 101, 242, 0.25);
      background: #141720;
    }
    .key-input {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 600;
      color: #a5b4fc;
    }
    .btn-register {
      margin-top: 8px;
      padding: 13px 20px;
      background: #5865F2;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 16px rgba(88, 101, 242, 0.4);
    }
    .btn-register:hover {
      background: #4752c4;
      transform: translateY(-1px);
      box-shadow: 0 6px 22px rgba(88, 101, 242, 0.55);
    }
    .btn-register:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .alert-box {
      background: rgba(240, 71, 71, 0.12);
      border: 1px solid rgba(240, 71, 71, 0.4);
      color: #ff7b7b;
      padding: 11px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .links-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 18px;
      font-size: 13px;
      color: var(--text-muted);
    }
    .links-row a {
      color: #5865F2;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.15s ease;
    }
    .links-row a:hover {
      color: #818cf8;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="register-container">
    <div class="register-card">
      <div class="brand-wrap">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#5865F2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>
          </svg>
        </div>
        <h1 class="title">Join INDRA BOT SYSTEM</h1>
        <p class="subtitle">Enter your personal License Key to activate your isolated dashboard.</p>
      </div>

      <div id="regAlert" class="alert-box" {% if not error %}style="display: none;"{% endif %}>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
        <span id="regAlertText">{{ error or 'Registration failed.' }}</span>
      </div>

      <form class="form-col" id="registerForm">
        <div class="form-group">
          <label for="licenseKey">License Key</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
            <input type="text" id="licenseKey" name="license_key" class="form-input key-input" placeholder="INDRA-VIP-2026" required autocomplete="off" autofocus>
          </div>
        </div>

        <div class="form-group">
          <label for="regEmail">Your Email</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
            <input type="email" id="regEmail" name="email" class="form-input" placeholder="your-email@domain.com" required autocomplete="email">
          </div>
        </div>

        <div class="form-group">
          <label for="regPassword">Create Password</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            <input type="password" id="regPassword" name="password" class="form-input" placeholder="At least 6 characters" required autocomplete="new-password">
          </div>
        </div>

        <div class="form-group">
          <label for="regConfirmPassword">Confirm Password</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            <input type="password" id="regConfirmPassword" name="confirm_password" class="form-input" placeholder="Repeat your password" required autocomplete="new-password">
          </div>
        </div>

        <button type="submit" class="btn-register" id="submitBtn">
          <span>Activate & Launch Studio</span>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
      </form>

      <div class="links-row">
        <span>Already registered?</span>
        <a href="/login">Sign In &rarr;</a>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('registerForm');
    const alertBox = document.getElementById('regAlert');
    const alertText = document.getElementById('regAlertText');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';

      const licenseKey = document.getElementById('licenseKey').value.trim().toUpperCase();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      const confirmPassword = document.getElementById('regConfirmPassword').value;

      if (password !== confirmPassword) {
        alertText.textContent = 'Passwords do not match.';
        alertBox.style.display = 'flex';
        return;
      }
      if (password.length < 6) {
        alertText.textContent = 'Password must be at least 6 characters long.';
        alertBox.style.display = 'flex';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.querySelector('span').textContent = 'Validating Key...';

      try {
        const res = await fetch('/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            license_key: licenseKey,
            email: email,
            password: password,
            confirm_password: confirmPassword
          })
        });
        const data = await res.json();
        if (data.ok) {
          submitBtn.querySelector('span').textContent = 'Account Activated! Redirecting...';
          submitBtn.style.background = '#43b581';
          setTimeout(() => {
            window.location.href = '/';
          }, 600);
        } else {
          alertText.textContent = data.error || 'Registration failed.';
          alertBox.style.display = 'flex';
          submitBtn.disabled = false;
          submitBtn.querySelector('span').textContent = 'Activate & Launch Studio';
        }
      } catch (err) {
        alertText.textContent = 'Network error. Please try again.';
        alertBox.style.display = 'flex';
        submitBtn.disabled = false;
        submitBtn.querySelector('span').textContent = 'Activate & Launch Studio';
      }
    });
  </script>
</body>
</html>
