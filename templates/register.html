<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Activate License &bull; INDRA BOT SYSTEM</title>
  <meta name="description" content="License Key Registration for INDRA BOT SYSTEM">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23181a20'/%3E%3Cpath d='M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.83z' transform='translate(1.2 1.2) scale(0.9)' fill='%23ffffff'/%3E%3Ccircle cx='7' cy='7' r='1.5' fill='%23181a20' transform='translate(1.2 1.2) scale(0.9)'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0a0b0e;
      --card-bg: #13151a;
      --card-border: #21242d;
      --input-bg: #0d0f13;
      --input-border: #232732;
      --input-focus: #4b5263;
      --text-white: #f8fafc;
      --text-muted: #8b92a4;
      --text-sub: #555b6d;
      --btn-bg: #1c1f27;
      --btn-hover: #252a35;
      --btn-border: #2c323f;
      --tag-bg: #0f1115;
      --tag-border: #1c1f26;
      --danger-bg: rgba(239, 68, 68, 0.08);
      --danger-border: rgba(239, 68, 68, 0.22);
      --danger-text: #f87171;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text-white);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .auth-container {
      width: 100%;
      max-width: 440px;
    }

    .auth-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 36px 30px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand-icon-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 54px;
      height: 54px;
      border-radius: 14px;
      background: #181a21;
      border: 1px solid #282c37;
      margin-bottom: 14px;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-white);
      margin-bottom: 4px;
    }

    .brand-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .alert-box {
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      color: var(--danger-text);
      padding: 11px 13px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label {
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #9ca3af;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      width: 17px;
      height: 17px;
      color: #555b6d;
      pointer-events: none;
    }

    .form-input {
      width: 100%;
      padding: 12px 14px 12px 42px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 10px;
      color: #ffffff;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .form-input::placeholder {
      color: #4b5563;
    }

    .form-input:focus {
      border-color: var(--input-focus);
      background: #101217;
    }

    .key-input {
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.05em;
      font-weight: 600;
      text-transform: uppercase;
      color: #e2e8f0;
    }

    /* Strength meter */
    .pwd-meter {
      height: 3px;
      width: 100%;
      background: #1a1d24;
      border-radius: 3px;
      margin-top: 4px;
      overflow: hidden;
    }

    .pwd-meter-fill {
      height: 100%;
      width: 0%;
      border-radius: 3px;
      transition: width 0.25s ease, background-color 0.25s ease;
    }

    .pwd-hint {
      font-size: 11px;
      color: var(--text-sub);
      display: flex;
      justify-content: space-between;
      margin-top: 2px;
    }

    .btn-toggle-pwd {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: #555b6d;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-toggle-pwd:hover {
      color: #9ca3af;
    }

    .btn-submit {
      width: 100%;
      padding: 13px;
      margin-top: 6px;
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .btn-submit:hover {
      background: var(--btn-hover);
      border-color: #384050;
    }

    .btn-submit:active {
      transform: translateY(1px);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .links-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #1a1d24;
      font-size: 13px;
      color: var(--text-muted);
    }

    .links-row a {
      color: #cbd5e1;
      text-decoration: none;
      font-weight: 600;
    }

    .links-row a:hover {
      color: #ffffff;
      text-decoration: underline;
    }

    .features-row {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 18px;
      flex-wrap: wrap;
    }

    .feature-tag {
      font-size: 11px;
      color: var(--text-sub);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--tag-bg);
      padding: 4px 9px;
      border-radius: 6px;
      border: 1px solid var(--tag-border);
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="auth-card">
      <div class="brand-header">
        <div class="brand-icon-wrap">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>
          </svg>
        </div>
        <h1 class="brand-title">Activate License</h1>
        <p class="brand-subtitle">Enter your personal license key to register</p>
      </div>

      <div id="regAlert" class="alert-box" {% if not error %}style="display: none;"{% endif %}>
        <svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
        <span id="regAlertText">{{ error or 'Registration failed.' }}</span>
      </div>

      <form class="auth-form" id="registerForm" method="POST" action="/register">
        <div class="form-group">
          <label class="form-label" for="licenseKey">License Key</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
            <input type="text" id="licenseKey" name="license_key" class="form-input key-input" placeholder="INDRA-XXXX-XXXX" required autocomplete="off" autofocus>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="regEmail">Your Email</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
            <input type="email" id="regEmail" name="email" class="form-input" placeholder="friend@domain.com" required autocomplete="email">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="regPassword">Create Password</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            <input type="password" id="regPassword" name="password" class="form-input" placeholder="At least 6 characters" required autocomplete="new-password">
            <button type="button" class="btn-toggle-pwd" id="togglePwdBtn" title="Toggle password visibility">
              <svg id="eyeIcon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
          <div class="pwd-meter"><div class="pwd-meter-fill" id="pwdMeterFill"></div></div>
          <div class="pwd-hint"><span id="pwdStrengthText">Strength: Too short</span><span>Min 6 chars</span></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="regConfirmPassword">Confirm Password</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            <input type="password" id="regConfirmPassword" name="confirm_password" class="form-input" placeholder="Repeat your password" required autocomplete="new-password">
          </div>
          <div class="pwd-hint"><span id="pwdMatchText" style="color: #64748b;">Passwords must match</span></div>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">
          <span>Activate Account</span>
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </button>
      </form>

      <div class="links-row">
        <span>Already have an account?</span>
        <a href="/login">Sign In &rarr;</a>
      </div>

      <div class="features-row">
        <span class="feature-tag">Dedicated Tenant</span>
        <span class="feature-tag">Isolated Files</span>
        <span class="feature-tag">Discord Ready</span>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('registerForm');
    const alertBox = document.getElementById('regAlert');
    const alertText = document.getElementById('regAlertText');
    const submitBtn = document.getElementById('submitBtn');
    const togglePwdBtn = document.getElementById('togglePwdBtn');
    const pwdInput = document.getElementById('regPassword');
    const confirmInput = document.getElementById('regConfirmPassword');
    const eyeIcon = document.getElementById('eyeIcon');
    const meterFill = document.getElementById('pwdMeterFill');
    const strengthText = document.getElementById('pwdStrengthText');
    const matchText = document.getElementById('pwdMatchText');
    const keyInput = document.getElementById('licenseKey');

    // Auto-clean license key
    keyInput.addEventListener('input', () => {
      keyInput.value = keyInput.value.toUpperCase().replace(/[^A-Z0-9-]/g, '');
    });

    togglePwdBtn.addEventListener('click', () => {
      const isPwd = pwdInput.type === 'password';
      pwdInput.type = isPwd ? 'text' : 'password';
      confirmInput.type = isPwd ? 'text' : 'password';
      eyeIcon.innerHTML = isPwd 
        ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>'
        : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
    });

    // Password strength check
    pwdInput.addEventListener('input', () => {
      const val = pwdInput.value;
      if (val.length === 0) {
        meterFill.style.width = '0%';
        strengthText.textContent = 'Strength: Too short';
        strengthText.style.color = '#555b6d';
      } else if (val.length < 6) {
        meterFill.style.width = '25%';
        meterFill.style.background = '#dc2626';
        strengthText.textContent = 'Strength: Too short';
        strengthText.style.color = '#dc2626';
      } else if (val.length < 10 && !/[0-9!@#$%^&*]/.test(val)) {
        meterFill.style.width = '55%';
        meterFill.style.background = '#d97706';
        strengthText.textContent = 'Strength: Medium';
        strengthText.style.color = '#d97706';
      } else {
        meterFill.style.width = '100%';
        meterFill.style.background = '#16a34a';
        strengthText.textContent = 'Strength: Strong';
        strengthText.style.color = '#16a34a';
      }
      checkMatch();
    });

    confirmInput.addEventListener('input', checkMatch);

    function checkMatch() {
      if (!confirmInput.value) {
        matchText.textContent = 'Passwords must match';
        matchText.style.color = '#555b6d';
      } else if (confirmInput.value === pwdInput.value) {
        matchText.textContent = '✓ Passwords match';
        matchText.style.color = '#16a34a';
      } else {
        matchText.textContent = '✗ Passwords do not match';
        matchText.style.color = '#dc2626';
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';

      const licenseKey = keyInput.value.trim().toUpperCase();
      const email = document.getElementById('regEmail').value.trim();
      const password = pwdInput.value;
      const confirmPassword = confirmInput.value;

      if (password !== confirmPassword) {
        alertText.textContent = 'Passwords do not match.';
        alertBox.style.display = 'flex';
        return;
      }
      if (password.length < 6) {
        alertText.textContent = 'Password must be at least 6 characters long.';
        alertBox.style.display = 'flex';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.querySelector('span').textContent = 'Validating...';

      try {
        const res = await fetch('/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            license_key: licenseKey,
            email: email,
            password: password,
            confirm_password: confirmPassword
          })
        });
        const data = await res.json();
        if (data.ok) {
          submitBtn.querySelector('span').textContent = 'Success! Loading Studio...';
          submitBtn.style.background = '#15803d';
          setTimeout(() => {
            window.location.href = '/';
          }, 400);
        } else {
          alertText.textContent = data.error || 'Registration failed.';
          alertBox.style.display = 'flex';
          submitBtn.disabled = false;
          submitBtn.querySelector('span').textContent = 'Activate Account';
        }
      } catch (err) {
        form.submit();
      }
    });
  </script>
</body>
</html>
