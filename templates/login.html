<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In &bull; INDRA BOT SYSTEM</title>
  <meta name="description" content="Sign In to INDRA BOT SYSTEM">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23181a20'/%3E%3Cpath d='M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.83z' transform='translate(1.2 1.2) scale(0.9)' fill='%23ffffff'/%3E%3Ccircle cx='7' cy='7' r='1.5' fill='%23181a20' transform='translate(1.2 1.2) scale(0.9)'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0a0b0e;
      --card-bg: #13151a;
      --card-border: #21242d;
      --input-bg: #0d0f13;
      --input-border: #232732;
      --input-focus: #4b5263;
      --text-white: #f8fafc;
      --text-muted: #8b92a4;
      --text-sub: #555b6d;
      --btn-bg: #1c1f27;
      --btn-hover: #252a35;
      --btn-border: #2c323f;
      --tag-bg: #0f1115;
      --tag-border: #1c1f26;
      --danger-bg: rgba(239, 68, 68, 0.08);
      --danger-border: rgba(239, 68, 68, 0.22);
      --danger-text: #f87171;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text-white);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .auth-container {
      width: 100%;
      max-width: 420px;
    }

    .auth-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 36px 30px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 26px;
    }

    .brand-icon-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 54px;
      height: 54px;
      border-radius: 14px;
      background: #181a21;
      border: 1px solid #282c37;
      margin-bottom: 14px;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-white);
      margin-bottom: 4px;
    }

    .brand-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #121418;
      border: 1px solid #20232b;
      color: #94a3b8;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      padding: 4px 11px;
      border-radius: 999px;
      margin-top: 10px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #22c55e;
    }

    .alert-box {
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      color: var(--danger-text);
      padding: 11px 13px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label {
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #9ca3af;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      width: 17px;
      height: 17px;
      color: #555b6d;
      pointer-events: none;
    }

    .form-input {
      width: 100%;
      padding: 12px 14px 12px 42px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 10px;
      color: #ffffff;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .form-input::placeholder {
      color: #4b5563;
    }

    .form-input:focus {
      border-color: var(--input-focus);
      background: #101217;
    }

    .btn-toggle-pwd {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: #555b6d;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-toggle-pwd:hover {
      color: #9ca3af;
    }

    .btn-submit {
      width: 100%;
      padding: 13px;
      margin-top: 6px;
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .btn-submit:hover {
      background: var(--btn-hover);
      border-color: #384050;
    }

    .btn-submit:active {
      transform: translateY(1px);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .links-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #1a1d24;
      font-size: 13px;
      color: var(--text-muted);
    }

    .links-row a {
      color: #cbd5e1;
      text-decoration: none;
      font-weight: 600;
    }

    .links-row a:hover {
      color: #ffffff;
      text-decoration: underline;
    }

    .features-row {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 18px;
      flex-wrap: wrap;
    }

    .feature-tag {
      font-size: 11px;
      color: var(--text-sub);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--tag-bg);
      padding: 4px 9px;
      border-radius: 6px;
      border: 1px solid var(--tag-border);
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="auth-card">
      <div class="brand-header">
        <div class="brand-icon-wrap">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <h1 class="brand-title">INDRA BOT SYSTEM</h1>
        <p class="brand-subtitle">Sign in to access your dashboard</p>
        <div class="status-pill">
          <span class="status-dot"></span>
          <span>System Online &bull; v2.0</span>
        </div>
      </div>

      <div id="loginAlert" class="alert-box" {% if not error %}style="display: none;"{% endif %}>
        <svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
        <span id="loginAlertText">{{ error or 'Invalid email or password.' }}</span>
      </div>

      <form class="auth-form" id="loginForm" method="POST" action="/login">
        <div class="form-group">
          <label class="form-label" for="adminEmail">Email Address</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
            <input type="email" id="adminEmail" name="email" class="form-input" placeholder="name@domain.com" required autocomplete="email" autofocus>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="adminPassword">Password</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            <input type="password" id="adminPassword" name="password" class="form-input" placeholder="Enter your password" required autocomplete="current-password">
            <button type="button" class="btn-toggle-pwd" id="togglePwdBtn" title="Toggle password visibility">
              <svg id="eyeIcon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">
          <span>Sign In</span>
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </button>
      </form>

      <div class="links-row">
        <span>Have a License Key?</span>
        <a href="/register">Register Account &rarr;</a>
      </div>

      <div class="features-row">
        <span class="feature-tag">Multi-Tenant</span>
        <span class="feature-tag">Isolated Storage</span>
        <span class="feature-tag">Zero-Storage CDN</span>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const alertBox = document.getElementById('loginAlert');
    const alertText = document.getElementById('loginAlertText');
    const submitBtn = document.getElementById('submitBtn');
    const togglePwdBtn = document.getElementById('togglePwdBtn');
    const pwdInput = document.getElementById('adminPassword');
    const eyeIcon = document.getElementById('eyeIcon');

    togglePwdBtn.addEventListener('click', () => {
      const isPwd = pwdInput.type === 'password';
      pwdInput.type = isPwd ? 'text' : 'password';
      eyeIcon.innerHTML = isPwd 
        ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>'
        : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';

      const email = document.getElementById('adminEmail').value.trim();
      const password = pwdInput.value;

      submitBtn.disabled = true;
      submitBtn.querySelector('span').textContent = 'Signing in...';

      try {
        const res = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (data.ok) {
          submitBtn.querySelector('span').textContent = 'Success! Loading...';
          submitBtn.style.background = '#15803d';
          setTimeout(() => {
            window.location.href = '/';
          }, 350);
        } else {
          alertText.textContent = data.error || 'Invalid credentials.';
          alertBox.style.display = 'flex';
          submitBtn.disabled = false;
          submitBtn.querySelector('span').textContent = 'Sign In';
        }
      } catch (err) {
        form.submit();
      }
    });
  </script>
</body>
</html>
