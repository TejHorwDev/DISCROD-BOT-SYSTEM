<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login &bull; INDRA BOT SYSTEM</title>
  <meta name="description" content="Secure Admin Login for INDRA BOT SYSTEM">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%235865F2'/%3E%3Cpath d='M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.83z' transform='translate(1.2 1.2) scale(0.9)' fill='%23fff'/%3E%3Ccircle cx='7' cy='7' r='1.5' fill='%235865F2' transform='translate(1.2 1.2) scale(0.9)'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <style>
    :root {
      --bg-oled: #08090b;
      --card-bg: rgba(16, 18, 24, 0.88);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-focus: #5865F2;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent-glow: rgba(88, 101, 242, 0.25);
    }
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background-color: var(--bg-oled);
      background-image: 
        radial-gradient(circle at 50% 15%, rgba(88, 101, 242, 0.12) 0%, transparent 60%),
        radial-gradient(circle at 85% 85%, rgba(67, 181, 129, 0.06) 0%, transparent 50%),
        radial-gradient(circle at 15% 85%, rgba(240, 71, 71, 0.05) 0%, transparent 50%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text-main);
      box-sizing: border-box;
    }
    .login-container {
      width: 100%;
      max-width: 440px;
      padding: 24px;
      box-sizing: border-box;
      position: relative;
      z-index: 10;
    }
    .login-card {
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 36px 32px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65), 0 0 40px rgba(88, 101, 242, 0.08);
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }
    .login-card:hover {
      border-color: rgba(88, 101, 242, 0.35);
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.75), 0 0 50px rgba(88, 101, 242, 0.15);
    }
    .login-brand {
      text-align: center;
      margin-bottom: 28px;
    }
    .brand-icon-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, rgba(88, 101, 242, 0.2), rgba(88, 101, 242, 0.05));
      border: 1px solid rgba(88, 101, 242, 0.4);
      border-radius: 18px;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px var(--accent-glow);
    }
    .login-title {
      margin: 0 0 6px 0;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #fff;
    }
    .login-subtitle {
      margin: 0;
      font-size: 13.5px;
      color: var(--text-muted);
      line-height: 1.4;
    }
    .login-form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-group label {
      font-size: 12.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #cbd5e1;
    }
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-icon {
      position: absolute;
      left: 14px;
      width: 18px;
      height: 18px;
      color: #64748b;
      pointer-events: none;
    }
    .form-input {
      width: 100%;
      padding: 12px 14px 12px 42px;
      background: #0f1117;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      color: #fff;
      font-size: 14.5px;
      outline: none;
      box-sizing: border-box;
      transition: all 0.2s ease;
    }
    .form-input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(88, 101, 242, 0.25);
      background: #141720;
    }
    .toggle-pwd {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: #64748b;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      transition: color 0.2s;
    }
    .toggle-pwd:hover {
      color: #fff;
    }
    .btn-login {
      margin-top: 8px;
      padding: 13px 20px;
      background: #5865F2;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 16px rgba(88, 101, 242, 0.4);
    }
    .btn-login:hover {
      background: #4752c4;
      transform: translateY(-1px);
      box-shadow: 0 6px 22px rgba(88, 101, 242, 0.55);
    }
    .btn-login:active {
      transform: translateY(0);
    }
    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .login-error {
      background: rgba(240, 71, 71, 0.12);
      border: 1px solid rgba(240, 71, 71, 0.4);
      color: #ff7b7b;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .login-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: #6b7280;
    }
    .security-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 5px 12px;
      border-radius: 20px;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <div class="login-brand">
        <div class="brand-icon-wrap">
          <svg viewBox="0 0 24 24" width="34" height="34" aria-hidden="true">
            <rect width="24" height="24" rx="6" fill="#5865F2"/>
            <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.83z" transform="translate(1.2 1.2) scale(0.9)" fill="#fff"/>
            <circle cx="7" cy="7" r="1.5" fill="#5865F2" transform="translate(1.2 1.2) scale(0.9)"/>
          </svg>
        </div>
        <h1 class="login-title">INDRA BOT SYSTEM</h1>
        <p class="login-subtitle">Sign in with your Admin credentials to access the management dashboard.</p>
      </div>

      <div id="loginAlert" class="login-error" style="display: none;">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
        <span id="loginAlertText">Invalid email or password.</span>
      </div>

      <form class="login-form" id="loginForm" method="POST" action="/login">
        <div class="form-group">
          <label for="adminEmail">Admin Email</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
            <input type="email" id="adminEmail" name="email" class="form-input" placeholder="admin@indra.gg" required autocomplete="email" autofocus>
          </div>
        </div>

        <div class="form-group">
          <label for="adminPassword">Password</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            <input type="password" id="adminPassword" name="password" class="form-input" placeholder="Enter your admin password" required autocomplete="current-password">
            <button type="button" class="toggle-pwd" id="togglePwdBtn" title="Show / Hide Password" aria-label="Toggle password visibility">
              <svg id="eyeIcon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-login" id="submitBtn">
          <span>Sign In</span>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </button>
      </form>

      <div class="login-footer">
        <div class="security-badge">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="#43b581"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg>
          <span>End-to-End Session Protection</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Password visibility toggle
    const pwdInput = document.getElementById('adminPassword');
    const toggleBtn = document.getElementById('togglePwdBtn');
    toggleBtn.addEventListener('click', () => {
      const isPwd = pwdInput.getAttribute('type') === 'password';
      pwdInput.setAttribute('type', isPwd ? 'text' : 'password');
      toggleBtn.style.color = isPwd ? '#5865F2' : '#64748b';
    });

    // AJAX submit for instant feedback without full page flash
    const form = document.getElementById('loginForm');
    const alertBox = document.getElementById('loginAlert');
    const alertText = document.getElementById('loginAlertText');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.querySelector('span').textContent = 'Verifying...';

      try {
        const res = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('adminEmail').value.trim(),
            password: pwdInput.value
          })
        });
        const data = await res.json();
        if (data.ok) {
          submitBtn.querySelector('span').textContent = 'Success! Redirecting...';
          submitBtn.style.background = '#43b581';
          window.location.href = '/';
        } else {
          alertText.textContent = data.error || 'Invalid admin credentials.';
          alertBox.style.display = 'flex';
          submitBtn.disabled = false;
          submitBtn.querySelector('span').textContent = 'Sign In';
        }
      } catch (err) {
        alertText.textContent = 'Connection error. Please try again.';
        alertBox.style.display = 'flex';
        submitBtn.disabled = false;
        submitBtn.querySelector('span').textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
